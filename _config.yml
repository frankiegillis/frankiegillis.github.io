title: "Frankie Gillis"
author: "Frankie Gillis"
description: "Personal website"
email: "fotg1@st-andrews.ac.uk"
github_username: "frankiegillis"
linkedin_username: "frankie-gillis"

theme: "minima"

rss: rss

kramdown:
  syntax_highlighter_opts:
    disable: true
    
plugins:
  - jekyll-feed
  - jekyll-sitemap

titles_from_headings:
  strip_title: true
  collections: true

defaults:
  - scope:
      path: ""
      type: post
    values:
      tags: Other

  use_google_fonts: true
  google_fonts_url: "https://fonts.googleapis.com/css2?family=Fira+Mono&family=Montserrat:wght@400;500&family=Open+Sans:wght@300;400;500;600;700&display=swap"
  use_self_hosted_fonts: false
  heading: "Montserrat"
  base: "Open Sans"
  monospace: "Fira Mono"
  logo: "Montserrat"
